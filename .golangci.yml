version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - unparam

formatters:
  enable:
    - gofumpt
